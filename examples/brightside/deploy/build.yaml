{
  "apiVersion": "v1",
  "kind": "List",
  "items": [
    {
      "apiVersion": "image.openshift.io/v1",
      "kind": "ImageStream",
      "metadata": {
        "name": "brightside",
        "namespace": "brightside-poc-build"
      },
      "spec": {
        "lookupPolicy": {
          "local": false
        }
      }
    },
    {
      "apiVersion": "build.openshift.io/v1",
      "kind": "BuildConfig",
      "metadata": {
        "name": "brightside",
        "namespace": "brightside-poc-build"
      },
      "spec": {
        "runPolicy": "Serial",
        "source": {
          "type": "Binary",
          "binary": {}
        },
        "strategy": {
          "type": "Docker",
          "dockerStrategy": {
            "dockerfilePath": "Dockerfile"
          }
        },
        "output": {
          "to": {
            "kind": "ImageStreamTag",
            "name": "brightside:latest"
          }
        },
        "resources": {
          "requests": {
            "cpu": "250m",
            "memory": "256Mi"
          },
          "limits": {
            "cpu": "2",
            "memory": "2Gi"
          }
        },
        "successfulBuildsHistoryLimit": 2,
        "failedBuildsHistoryLimit": 2
      }
    },
    {
      "apiVersion": "rbac.authorization.k8s.io/v1",
      "kind": "RoleBinding",
      "metadata": {
        "name": "brightside-image-puller",
        "namespace": "brightside-poc-build"
      },
      "roleRef": {
        "apiGroup": "rbac.authorization.k8s.io",
        "kind": "ClusterRole",
        "name": "system:image-puller"
      },
      "subjects": [
        {
          "kind": "ServiceAccount",
          "name": "brightside",
          "namespace": "brightside-poc-dev"
        }
      ]
    }
  ]
}
