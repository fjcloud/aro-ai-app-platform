{
  "apiVersion": "v1",
  "kind": "List",
  "items": [
    {
      "apiVersion": "networking.k8s.io/v1",
      "kind": "NetworkPolicy",
      "metadata": {
        "name": "brightside-router-ingress",
        "namespace": "brightside-poc-dev"
      },
      "spec": {
        "podSelector": {
          "matchLabels": {
            "app.kubernetes.io/name": "brightside"
          }
        },
        "policyTypes": [
          "Ingress"
        ],
        "ingress": [
          {
            "from": [
              {
                "namespaceSelector": {
                  "matchLabels": {
                    "kubernetes.io/metadata.name": "openshift-ingress"
                  }
                }
              }
            ],
            "ports": [
              {
                "protocol": "TCP",
                "port": 8080
              }
            ]
          }
        ]
      }
    },
    {
      "apiVersion": "networking.k8s.io/v1",
      "kind": "NetworkPolicy",
      "metadata": {
        "name": "d3-brightside-poc-ingress",
        "namespace": "decision-serving"
      },
      "spec": {
        "podSelector": {
          "matchLabels": {
            "serving.kserve.io/inferenceservice": "d3-mini"
          }
        },
        "policyTypes": [
          "Ingress"
        ],
        "ingress": [
          {
            "from": [
              {
                "namespaceSelector": {
                  "matchLabels": {
                    "kubernetes.io/metadata.name": "brightside-poc-dev"
                  }
                },
                "podSelector": {
                  "matchLabels": {
                    "app.kubernetes.io/name": "brightside"
                  }
                }
              }
            ],
            "ports": [
              {
                "protocol": "TCP",
                "port": 8080
              }
            ]
          }
        ]
      }
    }
  ]
}
