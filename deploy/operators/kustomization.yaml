apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  # Red Hat OpenShift AI (RHOAI)
  - rhoai-namespace.yaml
  - rhoai-operatorgroup.yaml
  - rhoai-subscription.yaml
  # Node Feature Discovery (NFD)
  - nfd-namespace.yaml
  - nfd-operatorgroup.yaml
  - nfd-subscription.yaml
  # NVIDIA GPU Operator
  - nvidia-namespace.yaml
  - nvidia-operatorgroup.yaml
  - nvidia-subscription.yaml
  # OpenShift Dev Spaces
  - devspaces-subscription.yaml
  # OpenShift GitOps (Argo CD)
  - gitops-namespace.yaml
  - gitops-operatorgroup.yaml
  - gitops-subscription.yaml
  # OpenShift Pipelines (Tekton)
  - pipelines-subscription.yaml
  # cert-manager (required by LeaderWorkerSet and Connectivity Link TLS)
  - cert-manager-namespace.yaml
  - cert-manager-operatorgroup.yaml
  - cert-manager-subscription.yaml
  # LeaderWorkerSet API (required by llm-d / LLMInferenceService)
  - lws-namespace.yaml
  - lws-operatorgroup.yaml
  - lws-subscription.yaml
  # Red Hat Connectivity Link (Kuadrant + Authorino + Limitador for MaaS)
  - rhcl-namespace.yaml
  - rhcl-operatorgroup.yaml
  - rhcl-subscription.yaml
  # Native OpenShift AI observability dashboards and metrics storage
  - coo.yaml
  - opentelemetry.yaml
