  annotations:
    openshift.io/display-name: Qwen3.8
    openshift.io/description: Red Hat AI Qwen3.8-27B-INT4 served with Red Hat vLLM CUDA
    opendatahub.io/genai-use-case: chat
spec:
  modelRef:
    kind: LLMInferenceService
    name: qwen3
