# Workshop-only SQLite/PVC deployment, not a production HA configuration.
# The operator requires artifact serving with a file:// destination.
# The exercise uses traces; this PVC setup is disposable, not production storage.
apiVersion: mlflow.opendatahub.io/v1
kind: MLflow
metadata:
  name: mlflow
spec:
  replicas: 1
  storage:
    accessModes: [ReadWriteOnce]
    resources:
      requests:
        storage: 10Gi
  backendStoreUri: sqlite:////mlflow/mlflow.db
  artifactsDestination: file:///mlflow/artifacts
  serveArtifacts: true
