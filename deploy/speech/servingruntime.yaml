apiVersion: serving.kserve.io/v1alpha1
kind: ServingRuntime
metadata:
  name: whisper-vllm
  namespace: speech-serving
  labels:
    opendatahub.io/dashboard: "true"
  annotations:
    openshift.io/display-name: Whisper on Red Hat AI Inference
    opendatahub.io/recommended-accelerators: '["nvidia.com/gpu"]'
spec:
  multiModel: false
  supportedModelFormats:
    - name: vLLM
      autoSelect: true
  containers:
    - name: kserve-container
      image: registry.redhat.io/rhaii/vllm-cuda-rhel9:3.5.0@sha256:5d4434598dc702b89c8d63b9fa6e2378130abf649c95f4211fb93e325cfd7698
      command: [python, -m, vllm.entrypoints.openai.api_server]
      args:
        - --port=8080
        - --model=openai/whisper-large-v3-turbo
        - --revision=41f01f3fe87f28c78e2fbf8b568835947dd65ed9
        - --served-model-name=whisper
        - --dtype=half
        - --max-model-len=448
        - --max-num-seqs=4
        - --gpu-memory-utilization=0.50
        - --enforce-eager
      env:
        - name: HF_HUB_OFFLINE
          value: "0"
        - name: TRANSFORMERS_OFFLINE
          value: "0"
        - name: HF_HOME
          value: /opt/models
        - name: HOME
          value: /opt/models
        - name: VLLM_NO_USAGE_STATS
          value: "1"
      ports:
        - containerPort: 8080
      readinessProbe:
        httpGet:
          path: /health
          port: 8080
        periodSeconds: 10
      livenessProbe:
        httpGet:
          path: /health
          port: 8080
        periodSeconds: 30
      startupProbe:
        httpGet:
          path: /health
          port: 8080
        periodSeconds: 10
        failureThreshold: 180
