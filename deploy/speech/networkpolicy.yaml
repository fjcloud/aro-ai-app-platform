# No public model Route. Only the application namespace and cluster monitoring
# can reach the inference port; OpenShift AI's own controller probes remain local.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: whisper-clients
  namespace: speech-serving
spec:
  podSelector:
    matchLabels:
      serving.kserve.io/inferenceservice: whisper
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: live-transcript-dev
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: speech-serving
      ports:
        - protocol: TCP
          port: 8080
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openshift-user-workload-monitoring
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: redhat-ods-monitoring
      ports:
        - protocol: TCP
          port: 8080
        - protocol: TCP
          port: 8443
        - protocol: TCP
          port: 9091
