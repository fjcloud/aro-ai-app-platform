apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: whisper
  namespace: speech-serving
  labels:
    opendatahub.io/dashboard: "true"
  annotations:
    serving.kserve.io/deploymentMode: RawDeployment
    serving.kserve.io/enable-prometheus-scraping: "true"
    security.opendatahub.io/enable-auth: "false"
    serving.kserve.io/enable-route: "false"
spec:
  predictor:
    minReplicas: 1
    maxReplicas: 1
    deploymentStrategy:
      type: Recreate
    nodeSelector:
      node.kubernetes.io/instance-type: Standard_NC8as_T4_v3
    tolerations:
      - key: nvidia.com/gpu
        operator: Exists
        effect: NoSchedule
    volumes:
      - name: model-cache
        persistentVolumeClaim:
          claimName: whisper-cache
      - name: shm
        emptyDir:
          medium: Memory
          sizeLimit: 1Gi
    model:
      runtime: whisper-vllm
      modelFormat:
        name: vLLM
      resources:
        requests:
          cpu: "2"
          memory: 8Gi
          nvidia.com/gpu: "1"
        limits:
          cpu: "4"
          memory: 16Gi
          nvidia.com/gpu: "1"
      volumeMounts:
        - name: model-cache
          mountPath: /opt/models
        - name: shm
          mountPath: /dev/shm
