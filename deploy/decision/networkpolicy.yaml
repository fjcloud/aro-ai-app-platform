apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: d3-mini-ingress
  namespace: decision-serving
spec:
  podSelector:
    matchLabels:
      serving.kserve.io/inferenceservice: d3-mini
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: signal-desk-dev
      podSelector:
        matchLabels:
          app.kubernetes.io/name: card-scout-platform
    - namespaceSelector:
        matchLabels:
          app.kubernetes.io/part-of: che.eclipse.org
          app.kubernetes.io/component: workspaces-namespace
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: decision-serving
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: openshift-monitoring
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: openshift-user-workload-monitoring
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: redhat-ods-monitoring
    ports:
    - protocol: TCP
      port: 8080
