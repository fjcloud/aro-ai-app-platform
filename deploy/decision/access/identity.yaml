apiVersion: v1
kind: ServiceAccount
metadata:
  name: d3-api
  namespace: decision-serving
  annotations:
    serviceaccounts.openshift.io/oauth-redirecturi.primary: https://d3-api.decision-serving.svc.cluster.local:8443/oauth/callback
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: workshop-d3-api-auth
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
subjects:
  - kind: ServiceAccount
    name: d3-api
    namespace: decision-serving
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: d3-api-user
  namespace: decision-serving
rules:
  - apiGroups: [""]
    resources: [services]
    resourceNames: [d3-api]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: d3-api-developer
  namespace: decision-serving
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: d3-api-user
subjects:
  - kind: ServiceAccount
    name: workshop-developer
    namespace: live-transcript-dev
