apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: signal-desk-dev
resources:
- ogxserver.yaml
configMapGenerator:
- name: llama-stack-config
  files:
  - config.yaml
generatorOptions:
  disableNameSuffixHash: true
  labels:
    ogx.io/watch: 'true'
    ogx.io/server: lsd-genai-playground
    opendatahub.io/dashboard: 'true'
