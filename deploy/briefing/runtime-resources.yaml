apiVersion: v1
kind: ServiceAccount
metadata:
  name: signal-desk
  namespace: signal-desk-dev
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: signal-desk-service-ca
  namespace: signal-desk-dev
  annotations:
    service.beta.openshift.io/inject-cabundle: 'true'
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: signal-desk-image-puller
  namespace: signal-desk-build
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:image-puller
subjects:
- kind: ServiceAccount
  name: signal-desk
  namespace: signal-desk-dev
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: signal-desk-image-puller
  namespace: signal-desk-dev
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:image-puller
subjects:
- kind: ServiceAccount
  name: signal-desk
  namespace: signal-desk-dev
