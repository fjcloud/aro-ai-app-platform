apiVersion: v1
kind: ServiceAccount
metadata:
  name: card-scout
  namespace: card-scout-dev
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: card-scout-service-ca
  namespace: card-scout-dev
  annotations:
    service.beta.openshift.io/inject-cabundle: 'true'
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: card-scout-image-puller
  namespace: card-scout-build
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:image-puller
subjects:
- kind: ServiceAccount
  name: card-scout
  namespace: card-scout-dev
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: card-scout-image-puller
  namespace: card-scout-dev
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:image-puller
subjects:
- kind: ServiceAccount
  name: card-scout
  namespace: card-scout-dev
