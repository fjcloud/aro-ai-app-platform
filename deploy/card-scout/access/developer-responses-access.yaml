apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: card-scout-devspaces-responses
  namespace: card-scout-dev
spec:
  podSelector:
    matchLabels:
      app: ogx
      app.kubernetes.io/instance: lsd-genai-playground
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              app.kubernetes.io/part-of: che.eclipse.org
              app.kubernetes.io/component: workspaces-namespace
      ports:
        - protocol: TCP
          port: 8321
