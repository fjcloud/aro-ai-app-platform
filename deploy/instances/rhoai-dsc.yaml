# RHOAI 3.5: kserve.modelsAsService is deprecated. Once it is Removed it cannot be
# re-enabled — enable Models-as-a-Service through aigateway.modelsAsAService.
# Dashboard + OGX expose the MaaS / Gen AI studio UI (API keys, subscriptions).
apiVersion: datasciencecluster.opendatahub.io/v2
kind: DataScienceCluster
metadata:
  name: default-dsc
spec:
  components:
    aigateway:
      managementState: Managed
      modelsAsAService:
        managementState: Managed
    dashboard:
      managementState: Managed
    kserve:
      managementState: Managed
      rawDeploymentServiceConfig: Headed
      nim:
        managementState: Removed
    aipipelines:
      managementState: Removed
    trainer:
      managementState: Removed
    kueue:
      managementState: Removed
    llamastackoperator:
      managementState: Removed
    mlflowoperator:
      managementState: Managed
    ogx:
      managementState: Managed
    ray:
      managementState: Removed
    trainingoperator:
      managementState: Removed
    trustyai:
      managementState: Managed
    workbenches:
      managementState: Removed
