# Wildcard cert from the default IngressController.
# hostname and certificateRefs.name are placeholders — configure-maas-gateway.sh
# replaces them from this cluster's Ingress domain and infrastructureName.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: maas-default-gateway
  namespace: openshift-ingress
  annotations:
    opendatahub.io/managed: "false"
  labels:
    app.kubernetes.io/name: maas
    app.kubernetes.io/component: gateway
    opendatahub.io/managed: "false"
spec:
  gatewayClassName: openshift-default
  listeners:
    - name: https
      hostname: maas.apps.cluster.example.com
      port: 443
      protocol: HTTPS
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: In
                values:
                  - llm-serving
                  - models-as-a-service
                  - redhat-ods-applications
                  - redhat-ai-gateway-infra
                  - openshift-ingress
      tls:
        mode: Terminate
        certificateRefs:
          - group: ""
            kind: Secret
            name: cluster-wildcard-cert
