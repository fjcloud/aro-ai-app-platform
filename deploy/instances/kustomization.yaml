apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  # OpenShift Dev Spaces
  - checluster.yaml
  - ai-tool-registry.yaml
  - opencode-workspace-config.yaml
  - vscode-editor-configurations.yaml
  # Node Feature Discovery
  - nfd-instance.yaml
  # NVIDIA GPU Operator
  - nvidia-clusterpolicy.yaml
  # OpenShift AI (RHOAI)
  - rhoai-dsci.yaml
  - rhoai-dsc.yaml
  # Models-as-a-Service prerequisites
  - uwm-cluster-monitoring-config.yaml
  - gatewayclass.yaml
  - maas-gateway.yaml
  - lws-operator.yaml
  - kuadrant.yaml
  - maas-namespace.yaml
  - maas-postgres.yaml

configMapGenerator:
  - name: nvidia-dcgm-exporter-dashboard
    namespace: openshift-config-managed
    files:
      - dcgm-exporter-dashboard.json
    options:
      disableNameSuffixHash: true
      labels:
        console.openshift.io/dashboard: "true"
        console.openshift.io/odc-dashboard: "true"
