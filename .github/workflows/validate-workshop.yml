name: validate workshop
on:
  pull_request:
  push:
    branches: [main, feature/cluster-voice-agentops, feature/decision-tetris, feature/orbit-checkpoint, feature/sky-control, feature/briefing-desk]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: examples/live-transcript/go.mod
          cache-dependency-path: examples/live-transcript/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: make test
      - run: go vet ./...
        working-directory: examples/live-transcript
      - run: go vet ./...
        working-directory: examples/decision-tetris
      - run: go vet ./...
        working-directory: examples/orbit-checkpoint
      - run: go vet ./...
        working-directory: examples/sky-control
      - run: make docs
      - run: go vet ./...
        working-directory: examples/briefing-desk
      - name: Install terminal browser dependencies
        run: npm ci --no-fund
        working-directory: e2e
      - name: Install Chromium for terminal checks
        run: npx playwright install --with-deps chromium
        working-directory: e2e
      - name: Validate terminal with explicit fixture providers
        run: go test -race -count=1 -run TestTerminalBrowserFixtures -timeout 120s ./...
        working-directory: examples/briefing-desk
        env:
          BROWSER_E2E: "1"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: weekly-game-fixture-results
          path: e2e/results/weekly-game/
