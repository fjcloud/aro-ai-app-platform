<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="870" viewBox="0 0 1120 870" role="img" aria-labelledby="title desc">
<title id="title">From prompt to a running application</title><desc id="desc">Git supplies the source and desired state. The registry supplies the built image.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0,0 L 10,5 L 0,10 z" fill="#687683"/></marker><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0,0 L 10,5 L 0,10 z" fill="#0066cc"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif}svg{background:white}</style>
<rect width="1120" height="870" rx="16" fill="white"/>
<rect x="40" y="36" width="38" height="5" rx="2" fill="#ee0000"/>
<text x="40" y="77" font-size="30" fill="#151515" font-weight="700" text-anchor="start" class="">From prompt to a running application</text>
<text x="40" y="108" font-size="18" fill="#52606d" font-weight="400" text-anchor="start" class="">Git supplies the source and desired state. The registry supplies the built image.</text>
<g data-role="node" data-node="code">
<rect x="60" y="165" width="260" height="145" rx="12" fill="white" stroke="#d5dbe1" stroke-width="1.5"/>
<rect x="61" y="183" width="4" height="25" rx="2" fill="#d5dbe1"/>
<text x="80" y="215.0" font-size="22" fill="#151515" font-weight="650" text-anchor="start" class="node-title">OpenCode</text>
<text x="80" y="252.0" font-size="18" fill="#52606d" font-weight="400" text-anchor="start" class="node-body">Generate from the</text>
<text x="80" y="276.0" font-size="18" fill="#52606d" font-weight="400" text-anchor="start" class="node-body">contract</text>
</g>
<g data-role="node" data-node="git">
<rect x="430" y="165" width="260" height="145" rx="12" fill="white" stroke="#ee0000" stroke-width="1.5"/>
<rect x="431" y="183" width="4" height="25" rx="2" fill="#ee0000"/>
<text x="450" y="201.5" font-size="22" fill="#151515" font-weight="650" text-anchor="start" class="node-title">Personal Git</text>
<text x="450" y="228.5" font-size="22" fill="#151515" font-weight="650" text-anchor="start" class="node-title">repository</text>
<text x="450" y="265.5" font-size="18" fill="#52606d" font-weight="400" text-anchor="start" class="node-body">Commit source +</text>
<text x="450" y="289.5" font-size="18" fill="#52606d" font-weight="400" text-anchor="start" class="node-body">manifests</text>
</g>
<g data-role="node" data-node="tekton">
<rect x="800" y="165" width="260" height="145" rx="12" fill="white" stroke="#d5dbe1" stroke-width="1.5"/>
<rect x="801" y="183" width="4" height="25" rx="2" fill="#d5dbe1"/>
<text x="820" y="215.0" font-size="22" fill="#151515" font-weight="650" text-anchor="start" class="node-title">Tekton Pipelines</text>
<text x="820" y="252.0" font-size="18" fill="#52606d" font-weight="400" text-anchor="start" class="node-body">Clone, validate and</text>
<text x="820" y="276.0" font-size="18" fill="#52606d" font-weight="400" text-anchor="start" class="node-body">build</text>
</g>
<path data-role="connector" data-source="code" data-target="git" data-points="[[320, 237.5], [430, 237.5]]" d="M 320,237.5 L 430,237.5" fill="none" stroke="#687683" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<g data-role="edge-label">
<rect x="348.6" y="205.5" width="52.8" height="26" rx="5" fill="white" stroke="white" stroke-width="1.5"/>
<text x="375.0" y="224.5" font-size="17" fill="#687683" font-weight="400" text-anchor="middle" class="">push</text>
</g>
<path data-role="connector" data-source="git" data-target="tekton" data-points="[[690, 237.5], [800, 237.5]]" d="M 690,237.5 L 800,237.5" fill="none" stroke="#687683" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<g data-role="edge-label">
<rect x="714.25" y="205.5" width="61.5" height="26" rx="5" fill="white" stroke="white" stroke-width="1.5"/>
<text x="745.0" y="224.5" font-size="17" fill="#687683" font-weight="400" text-anchor="middle" class="">clone</text>
</g>
<rect x="20" y="365" width="1080" height="420" rx="12" fill="#f6f7f9" stroke="#d5dbe1" stroke-width="1.5"/>
<text x="420" y="394" font-size="17" fill="#52606d" font-weight="600" text-anchor="start" class="">Reconcile, pull and expose</text>
<g data-role="node" data-node="argo">
<rect x="60" y="420" width="260" height="130" rx="12" fill="white" stroke="#d5dbe1" stroke-width="1.5"/>
<rect x="61" y="438" width="4" height="25" rx="2" fill="#d5dbe1"/>
<text x="80" y="462.5" font-size="22" fill="#151515" font-weight="650" text-anchor="start" class="node-title">Argo CD</text>
<text x="80" y="499.5" font-size="18" fill="#52606d" font-weight="400" text-anchor="start" class="node-body">Watch committed</text>
<text x="80" y="523.5" font-size="18" fill="#52606d" font-weight="400" text-anchor="start" class="node-body">manifests</text>
</g>
<g data-role="node" data-node="deploy">
<rect x="430" y="420" width="260" height="130" rx="12" fill="white" stroke="#ee0000" stroke-width="1.5"/>
<rect x="431" y="438" width="4" height="25" rx="2" fill="#ee0000"/>
<text x="450" y="462.5" font-size="22" fill="#151515" font-weight="650" text-anchor="start" class="node-title">App Deployment</text>
<text x="450" y="499.5" font-size="18" fill="#52606d" font-weight="400" text-anchor="start" class="node-body">Source and image</text>
<text x="450" y="523.5" font-size="18" fill="#52606d" font-weight="400" text-anchor="start" class="node-body">verified</text>
</g>
<g data-role="node" data-node="registry">
<rect x="800" y="420" width="260" height="130" rx="12" fill="white" stroke="#d5dbe1" stroke-width="1.5"/>
<rect x="801" y="438" width="4" height="25" rx="2" fill="#d5dbe1"/>
<text x="820" y="461.0" font-size="22" fill="#151515" font-weight="650" text-anchor="start" class="node-title">Internal image</text>
<text x="820" y="488.0" font-size="22" fill="#151515" font-weight="650" text-anchor="start" class="node-title">registry</text>
<text x="820" y="525.0" font-size="18" fill="#52606d" font-weight="400" text-anchor="start" class="node-body">Built application image</text>
</g>
<path data-role="connector" data-source="git" data-target="argo" data-points="[[560.0, 310], [560, 340], [190, 340], [190.0, 420]]" d="M 560.0,310 L 560,340 L 190,340 L 190.0,420" fill="none" stroke="#687683" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<g data-role="edge-label">
<rect x="284.45" y="311" width="131.1" height="26" rx="5" fill="white" stroke="white" stroke-width="1.5"/>
<text x="350" y="330" font-size="17" fill="#687683" font-weight="400" text-anchor="middle" class="">desired state</text>
</g>
<path data-role="connector" data-source="tekton" data-target="registry" data-points="[[930.0, 310], [930.0, 420]]" d="M 930.0,310 L 930.0,420" fill="none" stroke="#687683" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<g data-role="edge-label">
<rect x="952.5" y="331" width="105.0" height="26" rx="5" fill="white" stroke="white" stroke-width="1.5"/>
<text x="1005" y="350" font-size="17" fill="#687683" font-weight="400" text-anchor="middle" class="">push image</text>
</g>
<path data-role="connector" data-source="argo" data-target="deploy" data-points="[[320, 485.0], [430, 485.0]]" d="M 320,485.0 L 430,485.0" fill="none" stroke="#687683" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<g data-role="edge-label">
<rect x="344.25" y="453.0" width="61.5" height="26" rx="5" fill="white" stroke="white" stroke-width="1.5"/>
<text x="375.0" y="472.0" font-size="17" fill="#687683" font-weight="400" text-anchor="middle" class="">apply</text>
</g>
<path data-role="connector" data-source="registry" data-target="deploy" data-points="[[800, 485.0], [690, 485.0]]" d="M 800,485.0 L 690,485.0" fill="none" stroke="#687683" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<g data-role="edge-label">
<rect x="714.25" y="453.0" width="61.5" height="26" rx="5" fill="white" stroke="white" stroke-width="1.5"/>
<text x="745.0" y="472.0" font-size="17" fill="#687683" font-weight="400" text-anchor="middle" class="">image</text>
</g>
<g data-role="node" data-node="route">
<rect x="430" y="655" width="260" height="105" rx="12" fill="white" stroke="#d5dbe1" stroke-width="1.5"/>
<rect x="431" y="673" width="4" height="25" rx="2" fill="#d5dbe1"/>
<text x="450" y="697.0" font-size="22" fill="#151515" font-weight="650" text-anchor="start" class="node-title">Card Scout live</text>
<text x="450" y="734.0" font-size="18" fill="#52606d" font-weight="400" text-anchor="start" class="node-body">Public HTTPS Route</text>
</g>
<path data-role="connector" data-source="deploy" data-target="route" data-points="[[560.0, 550], [560.0, 655]]" d="M 560.0,550 L 560.0,655" fill="none" stroke="#687683" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<g data-role="edge-label">
<rect x="594.25" y="587" width="61.5" height="26" rx="5" fill="white" stroke="white" stroke-width="1.5"/>
<text x="625" y="606" font-size="17" fill="#687683" font-weight="400" text-anchor="middle" class="">serve</text>
</g>
<path d="M 40,814 H 1080" stroke="#d5dbe1"/>
<text x="40" y="845" font-size="16" fill="#52606d" font-weight="400" text-anchor="start" class="">Delivery is complete when Git revision, Argo CD health and the running image digest agree.</text>
</svg>
