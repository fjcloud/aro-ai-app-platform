apiVersion: v1
kind: Pod
metadata:
  name: mimo-9b-t4
  namespace: gpu-comparison
spec:
  restartPolicy: Never
  securityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  nodeSelector:
    workshop.fjcloud.io/gpu: t4
  tolerations:
  - key: nvidia.com/gpu
    operator: Equal
    value: present
    effect: NoSchedule
  containers:
  - name: vllm
    image: registry.redhat.io/rhaii/vllm-cuda-rhel9:3.5.0@sha256:5d4434598dc702b89c8d63b9fa6e2378130abf649c95f4211fb93e325cfd7698
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
        - ALL
    command:
    - python
    - -m
    - vllm.entrypoints.openai.api_server
    args:
    - --host
    - 127.0.0.1
    - --port
    - '8000'
    - --model
    - cyankiwi/MiMo-V2.6-Distill-Qwen-9B-AWQ-BF16-INT4
    - --revision
    - 30dc70c25a937c453b8503936c4959cff073e029
    - --served-model-name
    - mimo9b
    - --dtype
    - half
    - --kv-cache-dtype
    - float16
    - --max-model-len
    - '16384'
    - --max-num-seqs
    - '1'
    - --max-num-batched-tokens
    - '512'
    - --gpu-memory-utilization
    - '0.90'
    - --language-model-only
    - --enforce-eager
    - --reasoning-parser
    - qwen3
    - --enable-auto-tool-choice
    - --tool-call-parser
    - qwen3_coder
    env:
    - name: HF_HUB_OFFLINE
      value: '0'
    - name: TRANSFORMERS_OFFLINE
      value: '0'
    - name: HF_HOME
      value: /opt/models
    - name: HOME
      value: /opt/models
    resources:
      requests:
        cpu: '4'
        memory: 16Gi
        nvidia.com/gpu: '1'
      limits:
        cpu: '8'
        memory: 64Gi
        nvidia.com/gpu: '1'
    volumeMounts:
    - name: cache
      mountPath: /opt/models
    - name: shm
      mountPath: /dev/shm
  volumes:
  - name: cache
    persistentVolumeClaim:
      claimName: model-cache
  - name: shm
    emptyDir:
      medium: Memory
      sizeLimit: 16Gi
