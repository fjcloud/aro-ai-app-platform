apiVersion: v1
kind: Namespace
metadata:
  name: gpu-comparison
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: model-cache
  namespace: gpu-comparison
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: managed-csi
  resources:
    requests:
      storage: 60Gi
---
apiVersion: v1
kind: Pod
metadata:
  name: qwen-t4-auto
  namespace: gpu-comparison
spec:
  restartPolicy: Never
  securityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  nodeSelector:
    workshop.fjcloud.io/gpu: t4
  tolerations:
    - key: nvidia.com/gpu
      operator: Equal
      value: present
      effect: NoSchedule
  containers:
    - name: vllm
      image: registry.redhat.io/rhaii/vllm-cuda-rhel9:3.5.0
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: [ALL]
      command: [bash, -c]
      args:
        - |
          python - <<'PY'
          import torch
          print('CUDA:', torch.version.cuda, 'PyTorch:', torch.__version__, flush=True)
          for i in range(torch.cuda.device_count()):
              p = torch.cuda.get_device_properties(i)
              print('GPU:', i, p.name, 'MiB:', p.total_memory // 2**20, 'capability:', torch.cuda.get_device_capability(i), flush=True)
          print('Native BF16:', torch.cuda.is_bf16_supported(including_emulation=False), flush=True)
          PY
          exec python -m vllm.entrypoints.openai.api_server \
            --port=8000 --model=RedHatAI/Qwen3.8-27B-INT4 --served-model-name=qwen3 \
            --revision=91bd022d5b49442a868bc35008f6c21e1860edfa \
            --max-model-len=262144 --dtype=auto --kv-cache-dtype=float16 --tensor-parallel-size=4 \
            --gpu-memory-utilization=0.90 --max-num-seqs=16 --trust-remote-code \
            --reasoning-parser=qwen3 --enable-auto-tool-choice --tool-call-parser=qwen3_coder \
            --mm-encoder-tp-mode=data --enable-prefix-caching
      env:
        - name: HF_HUB_OFFLINE
          value: "0"
        - name: TRANSFORMERS_OFFLINE
          value: "0"
        - name: HF_HOME
          value: /opt/models
        - name: HOME
          value: /opt/models
      resources:
        requests:
          cpu: '4'
          memory: 16Gi
          nvidia.com/gpu: '4'
        limits:
          cpu: '8'
          memory: 64Gi
          nvidia.com/gpu: '4'
      volumeMounts:
        - name: cache
          mountPath: /opt/models
        - name: shm
          mountPath: /dev/shm
  volumes:
    - name: cache
      persistentVolumeClaim:
        claimName: model-cache
    - name: shm
      emptyDir:
        medium: Memory
        sizeLimit: 16Gi
