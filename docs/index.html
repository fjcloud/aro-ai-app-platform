<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ARO workshop — Azure CLI terminal</title>
  <link rel="stylesheet" href="vendor/xterm.css">
  <style>
    :root {
      --red: #ee0000;
      --ink: #151515;
      --muted: #4d4d4d;
      --line: #d2d2d2;
      --band: #f0f0f0;
      --white: #fff;
      --term: #1b1b1b;
      --header: 40px;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      color: var(--ink);
      background: var(--white);
      font: 16px/1.45 "Red Hat Text", "Segoe UI", sans-serif;
    }
    header {
      display: flex;
      align-items: center;
      gap: 16px;
      height: var(--header);
      padding: 0 12px;
      border-bottom: 2px solid var(--red);
      background: var(--white);
    }
    .brand { display: flex; align-items: center; gap: 8px; min-width: 0; }
    .mark {
      width: 12px;
      height: 12px;
      background: var(--red);
      flex: none;
    }
    h1 { font-size: 0.92rem; line-height: 1.2; margin: 0; font-weight: 600; white-space: nowrap; }
    #status {
      flex: 1;
      margin: 0;
      min-width: 0;
      color: var(--muted);
      font-size: 0.92rem;
      font-weight: 600;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .actions { display: flex; gap: 8px; }
    button {
      font: inherit;
      border-radius: 3px;
      padding: 4px 10px;
      font-size: 0.85rem;
      cursor: pointer;
    }
    button[type="submit"], #create {
      background: var(--red);
      color: var(--white);
      border: 1px solid var(--red);
    }
    button.secondary {
      background: var(--white);
      color: var(--ink);
      border: 1px solid var(--ink);
    }
    button:disabled { opacity: 0.55; cursor: default; }
    #gate {
      display: grid;
      place-items: center;
      min-height: calc(100vh - var(--header));
      padding: 32px 16px;
      background:
        linear-gradient(90deg, var(--band) 0 50%, var(--term) 50% 100%);
    }
    .card {
      width: min(640px, 100%);
      background: var(--white);
      border: 1px solid var(--line);
      box-shadow: 0 16px 40px rgba(21, 21, 21, 0.12);
      padding: 28px;
    }
    .card h2 { margin: 0 0 8px; font-size: 1.35rem; }
    .card p { margin: 0 0 16px; color: var(--muted); }
    label { display: block; font-weight: 600; margin-bottom: 6px; }
    textarea, input {
      width: 100%;
      font: 13px/1.45 ui-monospace, "Red Hat Mono", "DejaVu Sans Mono", Consolas, monospace;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 3px;
      background: #fafafa;
    }
    #creds { min-height: 168px; resize: vertical; }
    #creds:focus, input:focus { outline: 2px solid var(--ink); outline-offset: 1px; }
    .card .actions { margin-top: 16px; }
    .sr {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      border: 0;
    }
    #workspace {
      display: none;
      height: calc(100vh - var(--header));
      grid-template-columns: minmax(0, 1.15fr) 8px minmax(380px, 0.85fr);
    }
    body.live #gate { display: none; }
    body.live #workspace { display: grid; }
    .docs, .terminal-pane { min-width: 0; min-height: 0; }
    .docs { background: var(--band); }
    #workshop { width: 100%; height: 100%; border: 0; background: var(--white); }
    .splitter {
      background: #2b2b2b;
      cursor: col-resize;
      border-left: 1px solid #3c3c3c;
      border-right: 1px solid #3c3c3c;
    }
    .terminal-pane {
      display: flex;
      flex-direction: column;
      background: var(--term);
    }
    #terminal { flex: 1; min-height: 0; padding: 2px 6px 6px; }
    #terminal .xterm { height: 100%; }
    .xterm-viewport { overflow-y: auto !important; }
    @media (max-width: 640px) {
      #gate { background: var(--band); }
      header { height: auto; min-height: var(--header); flex-wrap: wrap; padding: 10px 16px; }
      #status { white-space: normal; flex-basis: 100%; order: 3; }
      #workspace { grid-template-columns: 1fr; grid-template-rows: minmax(240px, 42vh) minmax(280px, 1fr); }
      .splitter { display: none; }
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <span class="mark" aria-hidden="true"></span>
      <div>
        <h1>ARO workshop</h1>
      </div>
    </div>
    <p id="status" role="status">Paste the lab export to open the workshop.</p>
    <div class="actions">
      <button type="button" class="secondary" id="copy">Copy command</button>
      <button type="button" class="secondary" id="remove">Remove terminal</button>
    </div>
  </header>
  <form id="launcher">
    <section id="gate">
      <div class="card">
        <h2>Start the workshop</h2>
        <p>Paste the lab export. The workshop opens on the left. An Azure CLI terminal, already signed in, opens on the right.</p>
        <label for="creds">Lab export</label>
        <textarea id="creds" spellcheck="false" autocomplete="off" placeholder="export GUID=&#10;export CLIENT_ID=&#10;export PASSWORD=&#10;export TENANT=&#10;export SUBSCRIPTION=&#10;export RESOURCEGROUP="></textarea>
        <p id="parsed" class="sr"></p>
        <input id="repo" class="sr" name="repo" required type="url" value="https://github.com/fjcloud/aro-ai-app-platform.git" tabindex="-1">
        <textarea id="command" class="sr" readonly aria-label="Deploy command preview" tabindex="-1"></textarea>
        <div class="actions">
          <button type="submit" id="create">Start</button>
        </div>
      </div>
    </section>
    <section id="workspace">
      <div class="docs">
        <iframe id="workshop" title="ARO workshop instructions" referrerpolicy="no-referrer" sandbox="allow-scripts allow-same-origin allow-popups allow-forms allow-popups-to-escape-sandbox"></iframe>
      </div>
      <div class="splitter" id="splitter" role="separator" aria-orientation="vertical" aria-label="Resize workshop and terminal" tabindex="0"></div>
      <div class="terminal-pane">
        <div id="terminal" aria-label="Azure CLI terminal"></div>
      </div>
    </section>
  </form>
  <script>
    const form = document.querySelector("#launcher");
    const command = document.querySelector("#command");
    const status = document.querySelector("#status");
    const workshopUrl = "https://fjcloud.github.io/aro-ai-app-platform/modules/index.html";

    function showWorkshop() {
      document.body.classList.add("live");
      const frame = document.querySelector("#workshop");
      if (!frame.getAttribute("src")) frame.src = workshopUrl;
      requestAnimationFrame(() => {
        if (term && term.fitAddon) term.fitAddon.fit();
      });
    }

    function showGate() {
      document.body.classList.remove("live");
    }

    function sh(value) {
      return `'${String(value).replace(/'/g, `'\\''`)}'`;
    }

    function parseExports(text) {
      const out = {};
      for (const line of text.split(/\r?\n/)) {
        const match = line.match(/^\s*(?:export\s+)?([A-Za-z_][A-Za-z0-9_]*)\s*=\s*(.*?)\s*$/);
        if (!match) continue;
        let value = match[2];
        if ((value.startsWith("'") && value.endsWith("'")) || (value.startsWith('"') && value.endsWith('"'))) {
          value = value.slice(1, -1);
        }
        out[match[1]] = value;
      }
      return out;
    }

    function clusterName(guid, resourceGroup) {
      const raw = (guid || String(resourceGroup || "").replace(/^openenv-/i, "")).toLowerCase();
      const slug = raw.replace(/[^a-z0-9]/g, "").slice(0, 10);
      return slug ? `aro-${slug}` : "";
    }

    function fields() {
      const env = parseExports(document.querySelector("#creds").value);
      const guid = (env.GUID || "").trim();
      const resourceGroup = (env.RESOURCEGROUP || "").trim();
      return {
        guid,
        clientId: (env.CLIENT_ID || "").trim(),
        password: env.PASSWORD || "",
        tenant: (env.TENANT || "").trim(),
        subscription: (env.SUBSCRIPTION || "").trim(),
        resourceGroup,
        cluster: clusterName(guid, resourceGroup),
        repo: document.querySelector("#repo").value.trim(),
      };
    }

    function fieldError(data) {
      if (!data.clientId || !data.password || !data.tenant || !data.subscription || !data.resourceGroup) {
        return "Paste GUID, CLIENT_ID, PASSWORD, TENANT, SUBSCRIPTION, and RESOURCEGROUP.";
      }
      if (!/^[0-9a-fA-F-]{36}$/.test(data.clientId) || !/^[0-9a-fA-F-]{36}$/.test(data.subscription)) {
        return "CLIENT_ID and SUBSCRIPTION must be ids.";
      }
      if (!/^[A-Za-z0-9][A-Za-z0-9.-]{0,127}$/.test(data.tenant)) {
        return "TENANT must be a domain or tenant id.";
      }
      if (!/^[A-Za-z0-9][A-Za-z0-9._()-]{0,89}$/.test(data.resourceGroup)) {
        return "RESOURCEGROUP is not a resource group name.";
      }
      if (!/^[a-z][a-z0-9-]{1,13}$/.test(data.cluster)) {
        return "GUID must produce a cluster name of 2–14 lowercase letters, numbers, or hyphens.";
      }
      if (/[\r\n]/.test(data.password)) {
        return "PASSWORD cannot contain a line break.";
      }
      if (!/^https:\/\/\S+$/.test(data.repo)) {
        return "Repository must be an https URL.";
      }
      return "";
    }

    function build() {
      const data = fields();
      return `set -euo pipefail
export CLIENT_ID=${sh(data.clientId)}
export TENANT=${sh(data.tenant)}
export SUBSCRIPTION=${sh(data.subscription)}
export RESOURCEGROUP=${sh(data.resourceGroup)}
export CLUSTER_NAME=${sh(data.cluster)}
export CUSTOMER_RG_NAME="$RESOURCEGROUP"
az account set --subscription "$SUBSCRIPTION"
export LOCATION="$(az group show --name "$CUSTOMER_RG_NAME" --query location --output tsv)"
if [[ -z "$LOCATION" ]]; then
  echo "Resource group $CUSTOMER_RG_NAME was not found in subscription $SUBSCRIPTION."
  exit 1
fi
if ! az aro hcp cluster create -h 2>&1 | grep -q -- '--operators-authentication'; then
  echo "This shell still has the published aro extension. Refresh the page and press Start."
  exit 1
fi
if ! command -v oc >/dev/null 2>&1; then
  mkdir -p "$HOME/bin"
  curl -fsSL https://mirror.openshift.com/pub/openshift-v4/clients/ocp/stable-4.22/openshift-client-linux.tar.gz | tar -C "$HOME/bin" -xz oc
fi
export PATH="$HOME/bin:$PATH"
if [[ ! -f "$HOME/pull_secret.json" ]]; then
  echo "Put pull_secret.json in the home directory, then paste this command again."
  exit 1
fi
export PULL_SECRET_FILE="$HOME/pull_secret.json"
repo="$HOME/aro-ai-app-platform"
if [[ ! -d "$repo/.git" ]]; then
  git clone --depth 1 ${sh(data.repo)} "$repo"
fi
cd "$repo"
if command -v make >/dev/null 2>&1; then
  make deploy
else
  bash scripts/deploy.sh
fi
`;
    }

    function refresh() {
      const data = fields();
      const parsed = document.querySelector("#parsed");
      if (!data.clientId && !data.password && !data.tenant && !data.subscription && !data.resourceGroup) {
        command.value = "";
        parsed.textContent = "Paste the export block from the lab.";
        return;
      }
      const problem = fieldError(data);
      command.value = problem ? "" : build();
      parsed.textContent = problem
        ? problem
        : `Cluster ${data.cluster} in ${data.resourceGroup}. Secret captured. Region comes from the resource group.`;
    }

    function copyCommand() {
      const text = build();
      const area = document.createElement("textarea");
      area.value = text;
      area.setAttribute("readonly", "");
      area.style.position = "fixed";
      area.style.top = "0";
      area.style.left = "0";
      area.style.opacity = "0";
      document.body.appendChild(area);
      area.focus();
      area.select();
      area.setSelectionRange(0, text.length);
      let ok = false;
      try {
        ok = document.execCommand("copy");
      } catch {
        ok = false;
      }
      document.body.removeChild(area);
      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(text).catch(() => {});
      }
      return ok;
    }

    const sessionKey = "terminal-session";
    let sessionId = "";
    let socket = null;
    let term = null;
    let reconnects = 0;
    let reconnectTimer = 0;

    function terminal() {
      if (term) return term;
      term = new Terminal({
        cursorBlink: true,
        fontFamily: '"Red Hat Mono", "DejaVu Sans Mono", ui-monospace, Consolas, monospace',
        fontSize: 14,
        theme: {
          background: "#1b1b1b",
          foreground: "#f0f0f0",
          cursor: "#ee0000",
          cursorAccent: "#1b1b1b",
          selectionBackground: "#3c3c3c",
        },
      });
      term.open(document.querySelector("#terminal"));
      if (window.FitAddon) {
        const fit = new FitAddon.FitAddon();
        term.loadAddon(fit);
        term.fitAddon = fit;
        fit.fit();
        const pane = document.querySelector("#terminal");
        new ResizeObserver(() => fit.fit()).observe(pane);
      }
      term.onData((data) => {
        if (socket && socket.readyState === WebSocket.OPEN) {
          socket.send(new TextEncoder().encode(data));
        }
      });
      return term;
    }

    function remember(id) {
      sessionId = id || "";
      if (sessionId) sessionStorage.setItem(sessionKey, sessionId);
      else sessionStorage.removeItem(sessionKey);
    }

    async function watch(token) {
      for (;;) {
        if (token !== createToken) return;
        const poll = await fetch(`/api/terminal/${sessionId}`, { credentials: "same-origin" });
        const state = await poll.json();
        if (token !== createToken) return;
        if (!poll.ok) throw new Error(state.message || "The terminal session ended.");
        status.textContent = state.message || state.status;
        if (state.status === "ready") {
          attach(sessionId);
          return;
        }
        if (state.status === "deleted") {
          remember("");
          showGate();
          return;
        }
        if (state.status === "error") throw new Error(state.message || "The container failed.");
        await new Promise((resolve) => setTimeout(resolve, 2000));
      }
    }

    function attach(id) {
      const view = terminal();
      if (socket) {
        socket.onclose = null;
        socket.close();
      }
      const proto = location.protocol === "https:" ? "wss" : "ws";
      const current = new WebSocket(`${proto}://${location.host}/ws/${id}`);
      socket = current;
      current.binaryType = "arraybuffer";
      current.onopen = () => {
        status.textContent = "Terminal attached.";
        current.openedAt = Date.now();
        view.focus();
      };
      current.onmessage = (event) => {
        reconnects = 0;
        const bytes = event.data instanceof ArrayBuffer ? new Uint8Array(event.data) : event.data;
        view.write(bytes);
      };
      current.onclose = () => {
        if (socket !== current || !sessionId) return;
        if (current.openedAt && Date.now() - current.openedAt > 20000) reconnects = 0;
        reconnects += 1;
        if (reconnects > 8) {
          view.write("\r\nThe terminal disconnected. Press Start to open it again.\r\n");
          status.textContent = "The terminal disconnected. Press Start to open it again.";
          return;
        }
        view.write("\r\n[disconnected, reattaching]\r\n");
        status.textContent = "Reattaching to the existing terminal…";
        clearTimeout(reconnectTimer);
        reconnectTimer = setTimeout(() => {
          const token = ++createToken;
          watch(token).catch((error) => {
            view.write(`\r\n${error.message}\r\n`);
            status.textContent = error.message;
          });
        }, Math.min(1000 * reconnects, 3000));
      };
    }

    let createToken = 0;

    async function createTerminal() {
      const token = ++createToken;
      const data = fields();
      const problem = fieldError(data);
      if (problem) {
        status.textContent = problem;
        refresh();
        return;
      }
      if (!form.reportValidity()) return;
      refresh();
      copyCommand();
      showWorkshop();
      const button = document.querySelector("#create");
      button.disabled = true;
      status.textContent = "Starting the Azure CLI container…";
      const view = terminal();
      if (view.fitAddon) view.fitAddon.fit();
      view.write("\r\nStarting the Azure CLI container…\r\n");
      try {
        const response = await fetch("/api/terminal", {
          method: "POST",
          credentials: "same-origin",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            guid: data.guid,
            clientId: data.clientId,
            password: data.password,
            tenant: data.tenant,
            subscription: data.subscription,
            resourceGroup: data.resourceGroup,
            cols: view.cols || 80,
            rows: view.rows || 24,
          }),
        });
        const payload = await response.json();
        if (!response.ok) throw new Error(payload.message || "The terminal service rejected the request.");
        remember(payload.id);
        await watch(token);
      } catch (error) {
        status.textContent = error.message === "Failed to fetch"
          ? "Terminal service is not running on this host. Start it with python3 docs/terminal_server.py."
          : error.message;
      } finally {
        button.disabled = false;
      }
    }

    form.addEventListener("input", refresh);
    form.addEventListener("submit", (event) => {
      event.preventDefault();
      createTerminal();
    });
    document.querySelector("#copy").addEventListener("click", () => {
      refresh();
      const copied = copyCommand();
      status.textContent = copied
        ? "Command copied. Paste it in the terminal after Azure CLI is signed in."
        : "Press Copy command again, then paste it in the terminal.";
    });
    document.querySelector("#remove").addEventListener("click", async () => {
      if (!sessionId) {
        status.textContent = "There is no terminal to remove.";
        return;
      }
      const button = document.querySelector("#remove");
      createToken += 1;
      button.disabled = true;
      status.textContent = "Removing the container…";
      if (socket) {
        socket.onclose = null;
        socket.close();
      }
      const removing = sessionId;
      remember("");
      try {
        const response = await fetch(`/api/terminal/${removing}`, { method: "DELETE", credentials: "same-origin" });
        const payload = await response.json().catch(() => ({}));
        status.textContent = payload.message || (response.ok ? "Terminal container removed. The home directory was kept." : "Could not remove the container.");
        if (response.ok) showGate();
      } finally {
        button.disabled = false;
      }
    });
    fetch("/api/health").catch(() => {
      status.textContent = "Terminal service is not running on this host. Start it with python3 docs/terminal_server.py.";
    });
    const splitter = document.querySelector("#splitter");
    const workspace = document.querySelector("#workspace");
    let dragging = false;
    splitter.addEventListener("pointerdown", (event) => {
      dragging = true;
      splitter.setPointerCapture(event.pointerId);
    });
    splitter.addEventListener("pointermove", (event) => {
      if (!dragging) return;
      const bounds = workspace.getBoundingClientRect();
      const left = Math.min(Math.max(event.clientX - bounds.left, 280), bounds.width - 360);
      workspace.style.gridTemplateColumns = `${left}px 8px minmax(0, 1fr)`;
    });
    splitter.addEventListener("pointerup", () => { dragging = false; });
    refresh();
    resume().catch(() => {});

    async function resume() {
      let response = await fetch("/api/terminal", { credentials: "same-origin" });
      if (!response.ok) {
        const saved = sessionStorage.getItem(sessionKey);
        if (!saved) return;
        response = await fetch(`/api/terminal/${saved}`, { credentials: "same-origin" });
      }
      if (!response.ok) {
        sessionStorage.removeItem(sessionKey);
        return;
      }
      const state = await response.json();
      if (!state.id || state.status === "deleted") return;
      remember(state.id);
      showWorkshop();
      status.textContent = state.message || "Reattaching to the existing terminal…";
      const token = ++createToken;
      if (state.status === "ready") attach(state.id);
      else await watch(token);
    }
  </script>
  <script src="vendor/xterm.js"></script>
  <script src="vendor/xterm-addon-fit.js"></script>
</body>
</html>
